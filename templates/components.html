{% component image(path, width=none, alt=none) %}
<img src="{{ path }}"{% if width is not none %} width="{{ width }}"{% endif %}{% if alt is not none %} alt="{{ alt }}"{% endif %}>
{% endcomponent image %}

{% component scroll_code(path=none) %}
{% if path is not none %}
{% set content = load_data(path=path, format="plain") %}
<pre class="scroll-code"><code>{{ content }}</code></pre>
{% else %}
<pre class="scroll-code"><code>{{ body }}</code></pre>
{% endif %}
{% endcomponent scroll_code %}
